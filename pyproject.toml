[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stroke-nav"
version = "0.1.0"
description = "RL playground for guidewire + microcatheter navigation in patient-specific cerebrovascular anatomy (stroke thrombectomy)"
requires-python = ">=3.10"
# Versions pinned to the organiser's openng3_rl stack so trained models load on their side
# (see docs/HANDOVER.md): NumPy 1.26 pickles, Gymnasium 1.4.0, Stable-Baselines3 2.9.0.
dependencies = [
    "numpy==1.26.4",
    "scipy",
    "gymnasium==1.4.0",
    "stable-baselines3==2.9.0",
    "torch>=2.4",
    "pillow>=10,<13",
    "matplotlib",
    "requests",
    "pandas",
    "tensorboard",
]

[project.optional-dependencies]
viz = ["pyvista", "vtk", "imageio", "imageio-ffmpeg"]
dev = ["pytest", "pyarrow", "pandas"]
live = ["websocket-client==1.8.0"]  # headless physics page control (stroke_nav.organiser.live.renderer)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
